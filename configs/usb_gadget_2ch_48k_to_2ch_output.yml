---
title: "RASPIAUDIO USB Audio Gadget 2ch 48k to 2ch output"
description: "Host USB-C audio output -> Raspberry Pi UAC2Gadget stereo ALSA capture -> CamillaDSP -> RASPIAUDIO 2ch playback path. sndrpihifiberry is the Linux ALSA card name in the lab. Fixed 48 kHz / S32_LE."

devices:
  samplerate: 48000
  chunksize: 256
  target_level: 768
  adjust_period: 10
  capture:
    type: Alsa
    channels: 2
    device: "hw:CARD=UAC2Gadget,DEV=0"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:CARD=sndrpihifiberry,DEV=0"
    format: S32_LE

mixers:
  passthrough_2x2:
    channels:
      in: 2
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
            inverted: false
      - dest: 1
        sources:
          - channel: 1
            gain: 0
            inverted: false

pipeline:
  - type: Mixer
    name: passthrough_2x2
