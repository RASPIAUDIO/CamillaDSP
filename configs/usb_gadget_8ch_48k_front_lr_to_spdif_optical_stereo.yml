---
title: "RASPIAUDIO USB 7.1 front L/R to S/PDIF optical stereo"
description: "Host USB 7.1 audio -> Raspberry Pi UAC2Gadget 8-channel capture -> CamillaDSP front L/R -> RASPISPDIF optical stereo output. Fixed 48 kHz / S32_LE."

devices:
  samplerate: 48000
  chunksize: 960
  queuelimit: 8
  target_level: 2880
  adjust_period: 1
  enable_rate_adjust: true
  capture:
    type: Alsa
    channels: 8
    device: "hw:CARD=UAC2Gadget,DEV=0"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "hw:CARD=RASPISPDIF,DEV=0"
    format: S32_LE

mixers:
  usb_front_lr_to_spdif_stereo:
    channels:
      in: 8
      out: 2
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
            inverted: false
      - dest: 1
        sources:
          - channel: 1
            gain: 0
            inverted: false

pipeline:
  - type: Mixer
    name: usb_front_lr_to_spdif_stereo
