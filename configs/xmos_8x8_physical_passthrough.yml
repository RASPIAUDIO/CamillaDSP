---
title: "RASPIAUDIO XMOS 8xIN 8xOUT physical passthrough"
description: "Routage physique mesure sur XMOSDevice: chaque entree physique revient vers la sortie physique correspondante."

devices:
  samplerate: 48000
  chunksize: 1024
  target_level: 1024
  adjust_period: 10
  capture:
    type: Alsa
    channels: 8
    device: "hw:CARD=XMOSDevice,DEV=1"
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: "hw:CARD=XMOSDevice,DEV=0"
    format: S32_LE

mixers:
  xmos_physical_passthrough_8x8:
    channels:
      in: 8
      out: 8
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: 0
            inverted: false
      - dest: 1
        sources:
          - channel: 1
            gain: 0
            inverted: false
      - dest: 2
        sources:
          - channel: 2
            gain: 0
            inverted: false
      - dest: 3
        sources:
          - channel: 3
            gain: 0
            inverted: false
      - dest: 4
        sources:
          - channel: 4
            gain: 0
            inverted: false
      - dest: 5
        sources:
          - channel: 5
            gain: 0
            inverted: false
      - dest: 6
        sources:
          - channel: 6
            gain: 0
            inverted: false
      - dest: 7
        sources:
          - channel: 7
            gain: 0
            inverted: false

pipeline:
  - type: Mixer
    name: xmos_physical_passthrough_8x8
