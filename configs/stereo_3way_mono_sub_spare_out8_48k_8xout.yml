---
title: RASPIAUDIO stereo 3-way + mono sub + spare OUT8 active crossover 48k
description: USB stereo input -> CamillaDSP -> RASPIAUDIO 8xOUT. OUT4 is mono summed sub. OUT8 is mono full-range spare/test
  and muted by default.
devices:
  samplerate: 48000
  chunksize: 256
  target_level: 768
  adjust_period: 10
  capture:
    type: Alsa
    channels: 2
    device: hw:CARD=UAC2Gadget,DEV=0
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: hw:CARD=sndrpihifiberry,DEV=0
    format: S32_LE
mixers:
  usb_stereo_to_stereo_3way_mono_sub_spare_8xout:
    channels:
      in: 2
      out: 8
    description: Stereo 3-way plus mono summed sub on OUT4 and muted mono full-range spare on OUT8.
    mapping:
    - dest: 0
      sources:
      - channel: 0
        gain: 0.0
        inverted: false
    - dest: 1
      sources:
      - channel: 0
        gain: 0.0
        inverted: false
    - dest: 2
      sources:
      - channel: 0
        gain: 0.0
        inverted: false
    - dest: 3
      sources:
      - channel: 0
        gain: -6.0
        inverted: false
      - channel: 1
        gain: -6.0
        inverted: false
    - dest: 4
      sources:
      - channel: 1
        gain: 0.0
        inverted: false
    - dest: 5
      sources:
      - channel: 1
        gain: 0.0
        inverted: false
    - dest: 6
      sources:
      - channel: 1
        gain: 0.0
        inverted: false
    - dest: 7
      sources:
      - channel: 0
        gain: -6.0
        inverted: false
      - channel: 1
        gain: -6.0
        inverted: false
filters:
  Master_Safety_Gain_minus_12dB:
    type: Gain
    description: Global safety attenuation. Raise only after testing at low amplifier volume.
    parameters:
      gain: -12.0
      inverted: false
      mute: false
      scale: dB
  Sub_Lowpass_80Hz_LR24:
    type: BiquadCombo
    description: Sub Lowpass 80Hz LR24 crossover section.
    parameters:
      type: LinkwitzRileyLowpass
      freq: 80
      order: 4
  Woofer_Highpass_80Hz_LR24:
    type: BiquadCombo
    description: Woofer Highpass 80Hz LR24 crossover section.
    parameters:
      type: LinkwitzRileyHighpass
